<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拖动按钮</title>
  <style>
    #draggable-widget {
      position: fixed;
      left: 0;
      top: 80%;
      transform: translateY(-50%);
      z-index: 9999;
      cursor: pointer;
      display: flex;
      transition: all 0.3s ease;
    }
    #widget-body {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 37.5px;
      overflow: hidden;
      background: #A1D6FF;
      border-radius: 22px;
      height: 45px;
      transition: background-color 0.3s ease;
    }
    #rectangle {
      width: 0;
      height: 45px;
      background-color: #A1D6FF;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    #half-circle {
      width: 45px;
      height: 45px;
      background-color: #A1D6FF;
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
      transition: background-color 0.3s ease;
    }
    #bingo-icon {
      display: none;
      font-size: 24px;
      color: #3384D4;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="draggable-widget">
    <div id="rectangle"></div>
    <div id="half-circle"></div>
    <div id="bingo-icon">🔍</div>
  </div>

  <script>
    const widget = document.getElementById('draggable-widget');
    const rectangle = document.getElementById('rectangle');
    const halfCircle = document.getElementById('half-circle');
    const bingoIcon = document.getElementById('bingo-icon');

    let isClicked = false;
    let isDragging = false;
    let offsetY = 0;
    let initialClick = null;

    // 👉 页面加载时读取保存的位置
    window.addEventListener('DOMContentLoaded', () => {
      const savedTop = localStorage.getItem('widgetTop');
      if (savedTop) {
        widget.style.top = savedTop;
        widget.style.transform = ''; // 清除居中的 transform
      }
    });

    widget.addEventListener('mouseenter', () => {
      if (!isDragging) {
        rectangle.style.width = '30px';
        rectangle.style.background = '#66BFFF';
        halfCircle.style.background = '#66BFFF';
      }
    });

    widget.addEventListener('mouseleave', () => {
      if (!isDragging) {
        rectangle.style.width = '0';
        rectangle.style.backgroundColor = '#66BFFF';
        halfCircle.style.backgroundColor = '#66BFFF';
      }
    });

    widget.addEventListener('mousedown', (e) => {
      initialClick = { x: e.clientX, y: e.clientY };
      isDragging = true;
      offsetY = e.clientY - widget.offsetTop;
      widget.style.transition = 'none';
      rectangle.style.width = '30px';
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        let newTop = e.clientY - offsetY;
        if (newTop < 0) newTop = 0;
        if (newTop > window.innerHeight - widget.offsetHeight) {
          newTop = window.innerHeight - widget.offsetHeight;
        }
        widget.style.top = `${newTop}px`;
        widget.style.transform = ''; // 移动后清除原来的 translateY(-50%)
      }
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        widget.style.transition = 'top 0.3s ease';

        // 👉 保存当前位置
        localStorage.setItem('widgetTop', widget.style.top);
      }

      if (!isDragging) {
        rectangle.style.width = '0';
        rectangle.style.backgroundColor = '#66BFFF';
        halfCircle.style.backgroundColor = '#66BFFF';
      }
    });

    widget.addEventListener('click', () => {
      if (isClicked) {
        isClicked = false;
        rectangle.style.width = '0';
        rectangle.style.backgroundColor = '#66BFFF';
        halfCircle.style.backgroundColor = '#66BFFF';
        bingoIcon.style.display = 'none';
      } else {
        isClicked = true;
        rectangle.style.width = '30px';
        rectangle.style.backgroundColor = '#3384D4';
        halfCircle.style.backgroundColor = '#3384D4';
        bingoIcon.style.display = 'block';
      }
    });
  </script>

</body>
</html>
